<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
    <h1>My Website</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</header>

<!-- HERO SECTION -->
<section class="hero">
    <h2>Welcome to My Website</h2>
    <p>I am learning Website Development</p>
    <button>Get Started</button>
</section>

<!-- ABOUT -->
<section>
    <h2>About Me</h2>
    <p>This website is made using HTML, CSS and JavaScript.</p>
</section>

<!-- CONTACT FORM -->
<section>
    <h2>Contact Us</h2>
    <form>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea placeholder="Message"></textarea>
        <button type="submit">Send</button>
    </form>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 My Website</p>
</footer>

<!-- JS Link -->
<script src="script.js"></script>
</body>
</html>
